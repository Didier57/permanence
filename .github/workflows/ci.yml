name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://permanence:permanence@localhost:5432/permanence?schema=public
  APP_SECRET: ci-secret-0123456789abcdef0123456789abcdef

jobs:
  quality:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installer les dependances
        run: npm ci
      - name: Generer le client Prisma
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Verification des types
        run: npm run typecheck
      - name: Tests
        run: npm test

  docker:
    name: Image Docker (GHCR)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadonnees de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
      - name: Build et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
